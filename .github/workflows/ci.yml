name: CI

on:
  push:
    branches: ["main", "dev", "master"]
  pull_request:
    branches: ["main", "dev", "master"]

jobs:
  tier1-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Architecture
        run: |
          echo "tier=1 arch=${{ matrix.arch }}"
          uname -a
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        env:
          TL_SERVERLESS: "true"
        run: |
          cargo test --workspace --lib
          cargo test -p transfer-legacy-crypto-core -p transfer-legacy-shared-types
          cargo test -p transfer-legacy-api --bin transfer-legacy-api -- tests::security
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-audit
      - name: Cargo Deny
        run: cargo deny check
      - name: Cargo Audit
        run: cargo audit

  tier2-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose Parse (provider-neutral templates)
        run: |
          set -a
          . infra/environments/production.env.template
          . infra/profiles/standard.runtime.env
          set +a
          TL_ENV_FILE=/dev/null docker compose -f infra/docker-compose.yml config > /tmp/tl-compose-config.yml
