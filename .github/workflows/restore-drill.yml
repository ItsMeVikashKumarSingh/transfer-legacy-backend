name: "Weekly Restore Verification Drill (Supabase Sandbox)"

on:
  schedule:
    # Runs every Sunday at 04:00 UTC (after backup run)
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  verify-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 Client Tools
        run: |
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /etc/apt/keyrings/postgresql.asc
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Execute Restore Drill
        env:
          IDRIVE_ENDPOINT: ${{ secrets.IDRIVE_ENDPOINT || 'https://s3.ap-southeast-2.idrivee2.com' }}
          IDRIVE_BUCKET: ${{ secrets.IDRIVE_BUCKET || 'tl-db-backup' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.IDRIVE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDRIVE_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'ap-southeast-2' }}
          AWS_EC2_METADATA_DISABLED: 'true'
          BACKUP_ENCRYPT_PASSWORD: ${{ secrets.BACKUP_ENCRYPT_PASSWORD }}
        run: |
          chmod +x infra/scripts/restore-drill-idrive.sh
          ./infra/scripts/restore-drill-idrive.sh
